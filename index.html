<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synthetic Financial Engine Predictor (Hold & Spin Edition)</title>
    <style>
        :root {
            /* Black & White Grayscale Palette */
            --bg-color: #000000;
            --panel-bg: #111111;
            --text-main: #ffffff;
            --text-muted: #888888;
            
            /* Tag Accents */
            --accent-golden: #ffffff;
            --accent-parrots: #cccccc;
            --accent-minor: #999999;
            --accent-mini: #666666;
            --accent-big: #333333;
            --accent-blank: #444444; 
            --accent-price: #dddddd;
            
            /* UI Elements */
            --border-color: #333333;
            --state-dormant: #777777;
            --state-active: #ffffff;
            --state-replay: #bbbbbb;
            --state-waypoint: #999999;
            --state-freespin: #ffffff;
            --alert-red: #ff5555;
            --alert-red-muted: #aa3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 12px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            max-width: 1200px; width: 100%;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; gap: 16px; }
            body { padding: 8px; }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            width: 100%; transition: border-color 0.3s ease;
        }

        h2 {
            margin-top: 0; color: #fff; font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .state-badge {
            font-size: 0.75rem; padding: 4px 8px; border-radius: 12px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); border: 1px solid var(--border-color);
            background-color: #222222;
        }

        .state-dormant { background-color: #1a1a1a; color: var(--state-dormant); border: 1px solid var(--state-dormant); }
        .state-active { background-color: #2a2a2a; color: var(--state-active); border: 1px solid var(--state-active); }
        .state-replay { background-color: #222222; color: var(--state-replay); border: 1px solid var(--state-replay); }
        .state-waypoint { background-color: #111111; color: var(--state-waypoint); border: 1px dashed var(--state-waypoint); }
        .state-freespin { background-color: #ffffff; color: #000000; border: 1px solid #ffffff; }

        .main-input-group { 
            display: flex; gap: 10px; margin-bottom: 16px; 
        }

        #main-input {
            width: 100%; background-color: #000000; border: 2px solid #555555;
            color: #ffffff; padding: 14px; border-radius: 6px;
            font-family: monospace; font-size: 1.3rem; text-align: center;
            transition: border-color 0.2s ease;
        }
        
        #main-input:focus { outline: none; border-color: #ffffff; }

        .btn-step {
            background-color: #222222; border: 1px solid #555555; color: #ffffff;
            padding: 0 16px; border-radius: 6px; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
        }
        
        .btn-step:active {
            background-color: #ffffff; color: #000000; border-color: #ffffff;
        }

        .tag-buttons-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }

        .tag-btn {
            border: none; padding: 12px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 0.95rem;
            display: flex; justify-content: space-between; align-items: center;
            transition: opacity 0.2s;
            touch-action: manipulation;
        }
        
        .tag-btn span {
            font-size: 0.8rem; background: rgba(128,128,128,0.3);
            padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
        }

        .tag-btn:active { opacity: 0.6; }
        
        /* B&W Buttons */
        .btn-golden { background-color: #ffffff; color: #000000; }
        .btn-parrots { background-color: #cccccc; color: #000000; }
        .btn-minor { background-color: #999999; color: #000000; }
        .btn-mini { background-color: #666666; color: #ffffff; }
        .btn-big { background-color: #333333; color: #ffffff; border: 1px solid #555555; }
        .btn-blank { background-color: #111111; color: #aaaaaa; border: 1px dashed #555555; }

        /* B&W Text Colors */
        .color-golden { color: var(--accent-golden); }
        .color-parrots { color: var(--accent-parrots); }
        .color-minor { color: var(--accent-minor); }
        .color-mini { color: var(--accent-mini); }
        .color-big { color: var(--accent-big); }
        .color-blank { color: var(--accent-blank); }

        .pred-card {
            background-color: var(--bg-color); padding: 10px 12px;
            margin-bottom: 8px; border-radius: 4px; display: flex; flex-direction: column;
            border-left: 4px solid; border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
        }

        .pred-card-header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 4px;
        }

        .card-golden { border-left-color: var(--accent-golden); }
        .card-parrots { border-left-color: var(--accent-parrots); }
        .card-minor { border-left-color: var(--accent-minor); }
        .card-mini { border-left-color: var(--accent-mini); }
        .card-big { border-left-color: var(--accent-big); }
        .card-void { border-left-color: var(--alert-red); background-color: rgba(255, 0, 0, 0.05); }

        .pred-val { font-family: monospace; font-size: 1.05rem; color: #fff; font-weight: bold; }
        .pred-price { font-size: 0.85rem; color: var(--accent-price); font-weight: normal; }
        .pred-logic { font-size: 0.8rem; color: var(--text-muted); }

        .tactical-card {
            background-color: #1a1a1a;
            border: 1px dashed var(--text-muted);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.85rem;
            color: #cccccc;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .tactical-card strong { 
            color: var(--accent-golden); 
            display: block; 
            margin-bottom: 4px; 
            font-size: 0.9rem;
        }

        .tactical-warning {
            border-color: var(--alert-red-muted);
            background-color: rgba(170, 51, 51, 0.1);
        }
        .tactical-warning strong { color: var(--alert-red); }

        .tactical-freespin {
            border-color: #ffffff;
            background-color: #222222;
        }
        .tactical-freespin strong { color: #ffffff; }

        .history-list {
            list-style: none; padding: 0; margin: 0;
            max-height: 200px; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        .history-item {
            padding: 8px 4px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            font-family: monospace; font-size: 0.95rem;
        }

        .history-item:last-child { border-bottom: none; }
        
        .tag-group { display: flex; gap: 4px; }
        .tag {
            font-size: 0.65rem; padding: 3px 6px; border-radius: 4px;
            background-color: var(--border-color); text-transform: uppercase;
            font-weight: bold; color: #ffffff;
        }

        .sys-tag {
            font-size: 0.65rem; color: #ffffff; background: #444444;
            padding: 2px 5px; border-radius: 4px; margin-right: 8px;
        }
        
        .sys-tag-live { background: #ffffff; color: #000000; }

        .mode-description {
            font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;
            padding-bottom: 10px; border-bottom: 1px dashed var(--border-color);
        }

        .util-bar { display: flex; margin-top: 10px; width: 100%; }
        
        .btn-clear {
            background: none; border: 1px solid #555; color: #888;
            padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
            width: 100%; font-weight: bold; text-transform: uppercase;
        }
        .btn-clear:hover { background: #222; color: #fff; border-color: #fff; }
        
        .section-divider {
            margin-top: 24px; margin-bottom: 8px; font-size: 0.95rem;
            color: #fff; border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        
        .empty-placeholder {
            font-size: 0.85rem; color: var(--text-muted);
            font-style: italic; padding: 8px 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">
            <h2>Data Entry Console</h2>
            
            <div class="main-input-group">
                <input type="number" id="main-input" step="0.01" inputmode="decimal" placeholder="0.00">
                <button id="btn-step" class="btn-step" onclick="stepNumber()">TICK</button>
            </div>

            <div class="tag-buttons-grid">
                <button class="tag-btn btn-golden" onclick="addNumber('golden')">GOLDEN <span id="count-golden">0</span></button>
                <button class="tag-btn btn-blank" onclick="addNumber('blank')">BLANK <span id="count-blank">0</span></button>
                
                <button class="tag-btn btn-parrots" onclick="addNumber('parrots')">PARROTS <span id="count-parrots">0</span></button>
                <button class="tag-btn btn-minor" onclick="addNumber('minor')">MINOR <span id="count-minor">0</span></button>
                
                <button class="tag-btn btn-mini" onclick="addNumber('mini')">MINI <span id="count-mini">0</span></button>
                <button class="tag-btn btn-big" onclick="addNumber('big')">BIG <span id="count-big">0</span></button>
            </div>
            
            <div class="util-bar">
                <button class="btn-clear" onclick="clearData()">Reset to Baseline</button>
            </div>
        </div>

        <div class="panel" id="predictionPanel">
            <h2>Result <span id="stateBadge" class="state-badge">AWAITING INPUT</span></h2>
            <div id="modeDescription" class="mode-description">
                Input a number and select a tag. The system calculates engine recovery voids based on exact dollar payouts.
            </div>
            <div id="predictionsArea"></div>
            
            <div class="section-divider">Live Entries (New Data)</div>
            <ul class="history-list" id="historyListLive"></ul>
            
            <div class="section-divider">Baseline Database</div>
            <ul class="history-list" id="historyListBaseline"></ul>
        </div>
    </div>

    <script>
        // BASELINE DATASET
        const baselineDataset = [
            {val: 785.43, tag: 'golden', sys: 'A', block: 1}, {val: 785.53, tag: 'golden', sys: 'A', block: 1}, 
            {val: 787.72, tag: 'mini', sys: 'A', block: 1}, {val: 789.80, tag: 'big', sys: 'A', block: 1}, 
            {val: 790.29, tag: 'parrots', sys: 'A', block: 1}, {val: 790.57, tag: 'golden', sys: 'A', block: 1}, 
            {val: 791.30, tag: 'golden', sys: 'A', block: 1}, {val: 791.39, tag: 'big', sys: 'A', block: 1}, {val: 791.84, tag: 'mini', sys: 'A', block: 1},
            {val: 812.95, tag: 'golden', sys: 'A', block: 2}, {val: 813.05, tag: 'parrots', sys: 'A', block: 2}, 
            {val: 813.17, tag: 'parrots', sys: 'A', block: 2}, {val: 813.27, tag: 'golden', sys: 'A', block: 2},
            {val: 829.88, tag: 'parrots', sys: 'A', block: 3}, {val: 829.97, tag: 'parrots', sys: 'A', block: 3}, 
            {val: 830.52, tag: 'minor', sys: 'A', block: 3}, {val: 830.66, tag: 'golden', sys: 'A', block: 3}, {val: 830.68, tag: 'golden', sys: 'A', block: 3},
            {val: 846.46, tag: 'parrots', sys: 'A', block: 4}, {val: 846.67, tag: 'minor', sys: 'A', block: 4}, {val: 846.70, tag: 'golden', sys: 'A', block: 4}, 
            {val: 847.18, tag: 'big', sys: 'A', block: 4}, {val: 850.25, tag: 'golden', sys: 'A', block: 4}, {val: 850.52, tag: 'golden', sys: 'A', block: 4}, 
            {val: 850.55, tag: 'parrots', sys: 'A', block: 4}, {val: 850.65, tag: 'parrots', sys: 'A', block: 4}, {val: 850.71, tag: 'parrots', sys: 'A', block: 4}, 
            {val: 852.66, tag: 'golden', sys: 'A', block: 4}, {val: 852.70, tag: 'parrots', sys: 'A', block: 4}, {val: 852.70, tag: 'mini', sys: 'A', block: 4}, 
            {val: 861.78, tag: 'golden', sys: 'A', block: 5}, {val: 862.23, tag: 'golden', sys: 'A', block: 5},
            {val: 873.87, tag: 'golden', sys: 'A', block: 6}, {val: 874.30, tag: 'parrots', sys: 'A', block: 6}, {val: 874.43, tag: 'golden', sys: 'A', block: 6}, 
            {val: 874.70, tag: 'golden', sys: 'A', block: 6}, {val: 875.24, tag: 'golden', sys: 'A', block: 6},
            {val: 941.89, tag: 'mini', sys: 'A', block: 7},
            
            {val: 827.34, tag: 'golden', sys: 'B', block: 8}, {val: 827.91, tag: 'golden', sys: 'B', block: 8}, 
            {val: 828.21, tag: 'parrots', sys: 'B', block: 8}, {val: 828.96, tag: 'golden', sys: 'B', block: 8}, 
            {val: 829.35, tag: 'parrots', sys: 'B', block: 8}, {val: 829.54, tag: 'parrots', sys: 'B', block: 8}, 
            {val: 830.08, tag: 'parrots', sys: 'B', block: 8}, {val: 830.30, tag: 'golden', sys: 'B', block: 8},
            {val: 831.02, tag: 'mini', sys: 'B', block: 8}, {val: 831.13, tag: 'golden', sys: 'B', block: 8},
            {val: 832.22, tag: 'parrots', sys: 'B', block: 8}, {val: 832.32, tag: 'golden', sys: 'B', block: 8},
            {val: 995.42, tag: 'golden', sys: 'B', block: 9}, {val: 995.45, tag: 'parrots', sys: 'B', block: 9}, {val: 995.50, tag: 'golden', sys: 'B', block: 9},
            
            {val: 1078.14, tag: 'golden', sys: 'C', block: 10}, {val: 1078.48, tag: 'golden', sys: 'C', block: 10},
            {val: 1079.46, tag: 'parrots', sys: 'C', block: 10}, {val: 1079.84, tag: 'parrots', sys: 'C', block: 10},
            {val: 1080.30, tag: 'parrots', sys: 'C', block: 10}, {val: 1081.60, tag: 'minor', sys: 'C', block: 10},
            {val: 1084.03, tag: 'parrots', sys: 'C', block: 10}, {val: 1085.21, tag: 'golden', sys: 'C', block: 10},
            {val: 1085.78, tag: 'golden', sys: 'C', block: 10}, {val: 1086.62, tag: 'golden', sys: 'C', block: 10},
            {val: 1086.78, tag: 'parrots', sys: 'C', block: 10}, {val: 1086.93, tag: 'parrots', sys: 'C', block: 10},
            {val: 1086.97, tag: 'parrots', sys: 'C', block: 10}, {val: 1087.39, tag: 'golden', sys: 'C', block: 10},
            {val: 1087.99, tag: 'golden', sys: 'C', block: 10}, {val: 1088.06, tag: 'parrots', sys: 'C', block: 10},

            {val: 1145.84, tag: 'golden', sys: 'D', block: 11}, {val: 1146.50, tag: 'golden', sys: 'D', block: 11},
            {val: 1148.11, tag: 'parrots', sys: 'D', block: 11}, {val: 1148.43, tag: 'golden', sys: 'D', block: 11}
        ];

        let dataset = [];
        let storedData = localStorage.getItem('rngTrackerData');
        if (storedData) {
            dataset = JSON.parse(storedData);
        } else {
            dataset = [...baselineDataset];
        }

        const terminalSuffixes = [0.23, 0.24, 0.25, 0.30, 0.32, 0.42, 0.43, 0.50, 0.70, 0.84];
        let isManualTracking = false;

        document.getElementById('main-input').addEventListener('focus', function() {
            this.value = '';
            isManualTracking = false;
        });
        
        function stepNumber() {
            const input = document.getElementById('main-input');
            if (!input.value) return;
            let currentNum = parseFloat(input.value);
            if (!isNaN(currentNum)) {
                let cents = Math.round(currentNum * 100);
                let remainder = cents % 5;
                
                if (remainder === 3) {
                    currentNum = (cents + 2) / 100;
                } else {
                    currentNum = (cents + 1) / 100;
                }
                
                input.value = currentNum.toFixed(2);
                isManualTracking = true; 
            }
        }

        function saveData() { localStorage.setItem('rngTrackerData', JSON.stringify(dataset)); }

        function clearData() {
            if(confirm("Are you sure you want to delete all manually entered numbers and reset to the original baseline?")) {
                localStorage.removeItem('rngTrackerData');
                dataset = [...baselineDataset];
                document.getElementById('predictionsArea').innerHTML = '';
                isManualTracking = false;
                document.getElementById('main-input').value = '';
                renderData();
            }
        }

        function getLatestBlock() { return Math.max(...dataset.map(d => d.block)); }

        function formatDeltaPrice(targetNum, currentNum) {
            let diff = Math.abs(targetNum - currentNum);
            let totalTicks = Math.round(diff / 0.01);
            let blocksOfFive = Math.floor(totalTicks / 5);
            let remainderTicks = totalTicks % 5;
            let price = (blocksOfFive * 10.00) + (remainderTicks * 2.50);
            let sign = targetNum >= currentNum ? "+$" : "-$";
            return sign + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function buildCard(val, tag, logicText, currentNum, prefix = "+", isVoid = false) {
            let priceGap = formatDeltaPrice(val, currentNum);
            let diff = Math.abs(val - currentNum);
            let ticks = Math.round(diff / 0.01);
            
            let isGhostTick = (ticks % 5 === 4);
            let ghostWarning = isGhostTick ? ` <span style="color:#ff5555;font-size:0.7rem;">[Ghost Tick]</span>` : '';
            
            let cardClass = isVoid ? `card-void` : `card-${tag}`;
            
            return `<div class="pred-card ${cardClass}">
                        <div class="pred-card-header">
                            <span class="pred-val">${val.toFixed(2)}${ghostWarning}</span>
                            <span class="pred-price">[${prefix}${ticks} Visible Ticks &bull; ${priceGap} Cost]</span>
                        </div>
                        <span class="pred-logic">${logicText}</span>
                    </div>`;
        }

        function renderData() {
            const counts = { golden: 0, parrots: 0, minor: 0, mini: 0, big: 0, blank: 0 };
            dataset.forEach(item => { if (counts[item.tag] !== undefined) counts[item.tag]++; });
            
            ['golden', 'parrots', 'minor', 'mini', 'big', 'blank'].forEach(t => {
                document.getElementById(`count-${t}`).innerText = counts[t];
            });

            const listLive = document.getElementById('historyListLive');
            const listBaseline = document.getElementById('historyListBaseline');
            listLive.innerHTML = '';
            listBaseline.innerHTML = '';
            
            let hasLive = false;
            
            const grouped = {};
            dataset.forEach(d => {
                if(!grouped[d.val]) grouped[d.val] = { val: d.val, sys: d.sys, tags: [], payout: d.payout };
                grouped[d.val].tags.push(d.tag);
                // Keep the max payout if multiple
                if(d.payout && d.payout > (grouped[d.val].payout || 0)) grouped[d.val].payout = d.payout;
            });
            
            const sortedVals = Object.values(grouped).sort((a, b) => b.val - a.val);

            sortedVals.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                let tagsHtml = item.tags.map(t => `<span class="tag color-${t}" ${t === 'blank' ? 'style="background:#222;border:1px dashed #555;"' : ''}>${t}</span>`).join('');
                let sysClass = item.sys === 'Live' ? 'sys-tag sys-tag-live' : 'sys-tag';
                let payoutText = item.payout ? ` <span style="color:var(--accent-golden);font-size:0.75rem;">[$${item.payout}]</span>` : '';
                
                li.innerHTML = `
                    <div>
                        <span class="${sysClass}">Sys ${item.sys}</span>
                        <span>${item.val.toFixed(2)}${payoutText}</span>
                    </div>
                    <div class="tag-group">${tagsHtml}</div>
                `;
                
                if (item.sys === 'Live') {
                    listLive.appendChild(li);
                    hasLive = true;
                } else {
                    listBaseline.appendChild(li);
                }
            });
            
            if (!hasLive) {
                listLive.innerHTML = '<div class="empty-placeholder">No new data entries yet. Use the data entry console to add live numbers.</div>';
            }
        }

        function addNumber(tagType) {
            const inputField = document.getElementById('main-input');
            const numInput = inputField.value;
            if (!numInput) return;
            const num = parseFloat(numInput);
            
            let payoutAmt = 0;
            
            // PROMPT FOR SPECIFIC PAYOUTS
            if (tagType === 'golden') {
                let p = prompt(`Enter the total GOLDEN payout amount ($):\n(Include all Hold & Spin blocks + retriggers)`, "30");
                if (p === null) return; 
                payoutAmt = parseFloat(p) || 0;
            } else if (tagType === 'minor') {
                payoutAmt = 500;
            } else if (tagType === 'mini') {
                payoutAmt = 100;
            } else if (tagType === 'big') {
                let p = prompt(`Enter the total BIG payout amount ($):`, "0");
                if (p === null) return;
                payoutAmt = parseFloat(p) || 0;
            }
            
            let sortedDB = [...dataset].sort((a, b) => b.val - a.val);
            let lastVal = sortedDB.length > 0 ? sortedDB[0].val : num;
            let currentBlock = getLatestBlock();
            
            if(Math.abs(num - lastVal) > 2.00 && !dataset.find(d => d.val === num)) currentBlock++; 

            if (!dataset.find(d => d.val === num && d.tag === tagType)) {
                dataset.push({val: num, tag: tagType, sys: 'Live', block: currentBlock, payout: payoutAmt});
                saveData(); 
                renderData();
            }
            
            generatePredictions(num, tagType);
            inputField.blur(); 
        }

        function generatePredictions(currentNum, tagType) {
            const area = document.getElementById('predictionsArea');
            const stateBadge = document.getElementById('stateBadge');
            const modeDesc = document.getElementById('modeDescription');
            const predPanel = document.getElementById('predictionPanel');
            
            area.innerHTML = '';
            let chronoData = [...dataset].sort((a, b) => a.val - b.val);
            let historyIndex = chronoData.findIndex(d => d.val === currentNum && d.tag === tagType);

            let effectiveTag = tagType;
            let anchorNum = currentNum;
            let currentBlock = chronoData[historyIndex]?.block || getLatestBlock();
            let payoutValue = chronoData[historyIndex]?.payout || 0;

            if (tagType === 'blank') {
                let lastReal = [...chronoData].reverse().find(d => d.tag !== 'blank' && d.val < currentNum && d.block === currentBlock);
                if (lastReal) { effectiveTag = lastReal.tag; anchorNum = lastReal.val; payoutValue = lastReal.payout || 0; }
            }

            if (tagType !== 'blank' && historyIndex !== -1 && historyIndex < chronoData.length - 1) {
                let nextTarget = chronoData[historyIndex+1];
                if (chronoData[historyIndex].block === nextTarget.block && nextTarget.tag !== 'blank') {
                    stateBadge.className = 'state-badge state-replay';
                    stateBadge.innerText = 'STATE: SEQUENCE MATCH';
                    modeDesc.innerText = `The price is anchored in the database. Projecting exact historical sequence.`;
                    predPanel.style.borderColor = 'var(--state-replay)';

                    let html = `<div class="prediction-category"><h3 style="color:var(--state-replay);">Exact Sequence Replay</h3>`;
                    let max = Math.min(historyIndex + 5, chronoData.length);
                    for(let i = historyIndex + 1; i < max; i++) {
                        if(chronoData[i].block !== chronoData[historyIndex].block) break;
                        if(chronoData[i].tag === 'blank') continue;
                        html += buildCard(chronoData[i].val, chronoData[i].tag, `Contiguous Match (Target: ${chronoData[i].tag.toUpperCase()})`, currentNum);
                    }
                    html += `</div>`;
                    area.innerHTML = html;
                    return;
                }
            }

            let isDormant = (effectiveTag === 'golden' || effectiveTag === 'big' || effectiveTag === 'minor' || effectiveTag === 'mini');
            let isDarkZone = (tagType === 'blank' && effectiveTag === 'blank'); 
            let isFreeSpin = (effectiveTag === 'parrots'); 
            
            if (isDarkZone) {
                stateBadge.className = 'state-badge state-waypoint';
                stateBadge.innerText = `DARK ZONE (NO ANCHOR)`;
                modeDesc.innerText = `You entered a blind waypoint. Use Liquidity Nodes or Overflow Probes to navigate.`;
                predPanel.style.borderColor = 'var(--state-waypoint)';
            } else if (tagType === 'blank') {
                stateBadge.className = 'state-badge state-waypoint';
                stateBadge.innerText = `TRACKING BLANK (ANCHORED TO ${effectiveTag.toUpperCase()})`;
                modeDesc.innerText = `Adjusting remaining volume requirements anchored from ${anchorNum.toFixed(2)}.`;
                predPanel.style.borderColor = 'var(--state-waypoint)';
            } else if (isFreeSpin) {
                stateBadge.className = 'state-badge state-freespin';
                stateBadge.innerText = 'STATE: FREE SPIN WINDOW (PARROT LOCK)';
                modeDesc.innerText = 'Price is frozen for 6 free spins. Hidden volume bucket is aggressively loading. Expect an internal GOLDEN drop right here.';
                predPanel.style.borderColor = '#ffffff';
            } else if (isDormant) {
                stateBadge.className = 'state-badge state-dormant';
                stateBadge.innerText = 'STATE: DORMANT (ALGORITHMIC RECOVERY)';
                modeDesc.innerText = `System paid out $${payoutValue.toFixed(2)}. Calculating exact volume required to recoup liquidity before next drop.`;
                predPanel.style.borderColor = 'var(--state-dormant)';
            } else {
                stateBadge.className = 'state-badge state-active';
                stateBadge.innerText = 'STATE: ACTIVE (CLUSTER)';
                modeDesc.innerText = 'System is HOT. Prioritizing the 8-Push ($20.00 Volume) Hard-Lock.';
                predPanel.style.borderColor = 'var(--state-active)';
            }

            let html = ``;

            if (isDarkZone) {
                let baseInt = Math.floor(currentNum);
                let nextSuffixes = terminalSuffixes.map(s => {
                    let target = baseInt + s;
                    return target <= currentNum ? baseInt + 1 + s : target;
                }).sort((a, b) => a - b);

                html += `<div class="prediction-category">
                            <h3 style="color:var(--state-waypoint);">Option 1: Liquidity Node Intercept (Aggressive)</h3>
                            <div class="tactical-card">
                                <strong>Push toward nearest decimal grid traps:</strong>
                                Fund the pool to hit these specific resistance lines and force a payout roll.
                            </div>
                            ${buildCard(nextSuffixes[0], 'golden', `Primary Decimal Resistance`, currentNum, "+")}
                            ${buildCard(nextSuffixes[1], 'golden', `Secondary Decimal Resistance`, currentNum, "+")}
                         </div>`;

                html += `<div class="prediction-category">
                            <h3 style="color:var(--state-waypoint);">Option 2: Overflow Probe (Test)</h3>
                            <div class="tactical-card">
                                <strong>Input exactly $2.50 (1 Push) and watch the ticker:</strong><br>
                                &bull; If it ticks +0.01: The bucket is empty. Stagnant volume.<br>
                                &bull; If it skips +0.02: The bucket is heavy (holds +$1.50). System is highly active.
                            </div>
                         </div>`;

                html += `<div class="prediction-category">
                            <h3 style="color:var(--state-waypoint);">Option 3: Waypoint Ambush (Safe)</h3>
                            <div class="tactical-card">
                                <strong>Hold position and let others fund the pool:</strong><br>
                                Wait for any tag to drop before injecting capital.<br>
                                &bull; If Jackpot drops: System resets to Algorithmic Recovery.<br>
                                &bull; If Parrot drops: System enters Free Spin Window.
                            </div>
                         </div>`;
                         
                area.innerHTML = html;
                return;
            }

            if (isFreeSpin) {
                html += `<div class="prediction-category">
                            <h3 style="color:#ffffff;">⚠️ 6-Spin Compressed Volume Window</h3>
                            <div class="tactical-card tactical-freespin">
                                <strong>Internal Golden Drop High Probability</strong>
                                Price is locked during this Parrot sequence. Unlisted volume is aggressively filling the background overflow bucket without lifting the price tape. Watch closely for an internal <strong>Golden</strong> drop to materialize on this exact frozen price before the free spins release.
                            </div>
                         </div>`;
            }

            // DYNAMIC COOLDOWN CALCULATION (If Dormant & Payout logged)
            if (isDormant && payoutValue > 0) {
                // Every $2.00 of volume = 1 tick (0.01)
                let recoveryTicks = Math.ceil(payoutValue / 2);
                let recoveryDistance = recoveryTicks * 0.01;
                let safeTarget = anchorNum + recoveryDistance;
                
                html += `<div class="prediction-category">
                            <h3 style="color:var(--alert-red);">⚠️ Calculated Dead Zone ($${payoutValue} Recovery)</h3>
                            <div class="tactical-card tactical-warning">
                                <strong>Engine Drain Active</strong>
                                The system just lost $${payoutValue.toFixed(2)}. It must absorb this exact amount in public volume before opening another payout window. This mathematically forces a dead zone of at least <strong>${recoveryTicks} ticks</strong>. Do not inject capital until the price crosses the safe zone line.
                            </div>
                            ${buildCard(safeTarget, 'golden', `Calculated Recovery Line (End of Dead Zone)`, currentNum, "Min ", true)}
                         </div>`;
            } else if (isDormant) {
                let baseInt = Math.floor(currentNum);
                let nextSuffixes = terminalSuffixes.map(s => {
                    let target = baseInt + s;
                    return target <= currentNum ? baseInt + 1 + s : target;
                }).sort((a, b) => a - b);
                
                html += `<div class="prediction-category">
                            <h3 style="color:var(--alert-red);">⚠️ Unknown Payout Dead Zone</h3>
                            <div class="tactical-card tactical-warning">
                                <strong>No Payout Value Entered</strong>
                                Because the payout value is unknown, the recovery void length cannot be calculated. Enforce a strict stop-loss. Only test up to the next hardcoded resistance node. If it fails, cut inputs immediately.
                            </div>
                            ${buildCard(nextSuffixes[0], 'golden', `Primary Decimal Resistance (Stop-Loss)`, currentNum, "+")}
                         </div>`;
            }

            let tenTickTarget = anchorNum + 0.10;
            if (!isDormant && !isFreeSpin && effectiveTag !== 'blank' && tenTickTarget > currentNum) {
                html += `<div class="prediction-category">
                            <h3 style="color:var(--state-active);">Primary Active Traps</h3>
                            ${buildCard(tenTickTarget, 'golden', `Absolute $20 Volume Lock (from${anchorNum.toFixed(2)})`, currentNum, "+")}
                         </div>`;
            }

            let historicalNexts = [];
            for(let i = 0; i < chronoData.length - 1; i++) {
                if(chronoData[i].tag === effectiveTag) {
                    let nextReal = null;
                    for(let j = i + 1; j < chronoData.length; j++) {
                        if(chronoData[j].block !== chronoData[i].block) break;
                        if(chronoData[j].tag !== 'blank') { nextReal = chronoData[j]; break; }
                    }
                    if(nextReal) {
                        let gap = Math.round((nextReal.val - chronoData[i].val) / 0.01);
                        historicalNexts.push({ gap: gap, nextTag: nextReal.tag });
                    }
                }
            }

            let uniqueGaps = [];
            let seenGaps = new Set();
            for(let h of historicalNexts) {
                if(!seenGaps.has(h.gap)) { seenGaps.add(h.gap); uniqueGaps.push(h); }
            }
            uniqueGaps.sort((a, b) => a.gap - b.gap);
            
            html += `<div class="prediction-category"><h3>Projected Historical Drop Gaps</h3>`;
            
            let displayedCount = 0;
            uniqueGaps.forEach(u => {
                if (displayedCount >= 5) return;
                let projectedVal = anchorNum + (u.gap * 0.01);
                // If we are in a calculated dead zone, don't suggest targets inside the dead zone
                let isInsideDeadZone = (isDormant && payoutValue > 0 && projectedVal < (anchorNum + (payoutValue/2)*0.01));
                
                if (projectedVal > currentNum && (!isDormant ? u.gap !== 10 : true) && !isInsideDeadZone) {
                    html += buildCard(projectedVal, u.nextTag, `Verified Dollar Gap (Anchored to ${anchorNum.toFixed(2)})`, currentNum, "+");
                    displayedCount++;
                }
            });

            if(displayedCount === 0) {
                 html += `<p style="font-size:0.85rem; color:var(--text-muted);">No valid historical targets found for this zone.</p>`;
            }
            
            html += `</div>`;
            area.innerHTML = html;
        }

        renderData();
    </script>
</body>
</html>
