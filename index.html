<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual-State Predictor (Block Boundary Edition)</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151a23;
            --text-main: #c7d0d9;
            --accent-golden: #f3c22b;
            --accent-parrots: #29b6f6;
            --accent-minor: #9c27b0;
            --accent-mini: #ff9800;
            --accent-big: #ef5350;
            --accent-price: #81e6d9;
            --border-color: #2b3340;
            --state-dormant: #455a64;
            --state-active: #00e676;
            --state-replay: #29b6f6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; gap: 16px; }
            body { padding: 8px; }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            transition: border-color 0.3s ease;
        }

        h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .state-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: var(--border-color);
            color: #8892a0;
        }

        .state-dormant { background-color: rgba(69, 90, 100, 0.2); color: var(--state-dormant); border: 1px solid var(--state-dormant); }
        .state-active { background-color: rgba(0, 230, 118, 0.1); color: var(--state-active); border: 1px solid var(--state-active); }
        .state-replay { background-color: rgba(41, 182, 246, 0.1); color: var(--state-replay); border: 1px solid var(--state-replay); }

        .main-input-group {
            margin-bottom: 16px;
        }

        #main-input {
            width: 100%;
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.3rem;
            text-align: center;
        }
        
        #main-input:focus {
            outline: none;
            border-color: var(--text-main);
        }

        .tag-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tag-buttons-grid .full-width {
            grid-column: 1 / -1; 
        }

        .tag-btn {
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.2s;
            touch-action: manipulation;
        }
        
        .tag-btn span {
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .tag-btn:active { opacity: 0.6; }
        
        .btn-golden { background-color: var(--accent-golden); color: #000; }
        .btn-parrots { background-color: var(--accent-parrots); color: #000; }
        .btn-minor { background-color: var(--accent-minor); color: #fff;}
        .btn-mini { background-color: var(--accent-mini); color: #000; }
        .btn-big { background-color: var(--accent-big); color: #fff;}

        .color-golden { color: var(--accent-golden); }
        .color-parrots { color: var(--accent-parrots); }
        .color-minor { color: var(--accent-minor); }
        .color-mini { color: var(--accent-mini); }
        .color-big { color: var(--accent-big); }

        .pred-card {
            background-color: var(--bg-color);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid;
        }

        .pred-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
        }

        .card-golden { border-left-color: var(--accent-golden); }
        .card-parrots { border-left-color: var(--accent-parrots); }
        .card-minor { border-left-color: var(--accent-minor); }
        .card-mini { border-left-color: var(--accent-mini); }
        .card-big { border-left-color: var(--accent-big); }

        .pred-val {
            font-family: monospace;
            font-size: 1.05rem;
            color: #fff;
            font-weight: bold;
        }

        .pred-price {
            font-size: 0.85rem;
            color: var(--accent-price);
            font-weight: normal;
        }

        .pred-logic {
            font-size: 0.8rem;
            color: #8892a0;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .history-item {
            padding: 8px 4px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .history-item:last-child { border-bottom: none; }
        
        .tag-group {
            display: flex;
            gap: 4px;
        }

        .tag {
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
            background-color: var(--border-color);
            text-transform: uppercase;
            font-weight: bold;
        }

        .sys-tag {
            font-size: 0.65rem;
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 2px 5px;
            border-radius: 4px;
            margin-right: 8px;
        }
        
        .mode-description {
            font-size: 0.85rem;
            color: #8892a0;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP/LEFT PANEL -->
        <div class="panel">
            <h2>Data Entry Console</h2>
            
            <div class="main-input-group">
                <input type="number" id="main-input" step="0.01" inputmode="decimal" placeholder="Enter Ticker Number...">
            </div>

            <div class="tag-buttons-grid">
                <button class="tag-btn btn-golden full-width" onclick="addNumber('golden')">GOLDEN <span id="count-golden">0</span></button>
                <button class="tag-btn btn-parrots" onclick="addNumber('parrots')">PARROTS <span id="count-parrots">0</span></button>
                <button class="tag-btn btn-minor" onclick="addNumber('minor')">MINOR <span id="count-minor">0</span></button>
                <button class="tag-btn btn-mini" onclick="addNumber('mini')">MINI <span id="count-mini">0</span></button>
                <button class="tag-btn btn-big" onclick="addNumber('big')">BIG <span id="count-big">0</span></button>
            </div>
            
            <h3 style="margin-top: 18px; font-size: 0.95rem;">Contiguous Monitored Blocks</h3>
            <ul class="history-list" id="historyList">
                <!-- History populated by JS -->
            </ul>
        </div>

        <!-- BOTTOM/RIGHT PANEL -->
        <div class="panel" id="predictionPanel">
            <h2>Algorithmic Projections <span id="stateBadge" class="state-badge">AWAITING INPUT</span></h2>
            <div id="modeDescription" class="mode-description">
                Input a number and select a tag to dynamically project future tick patterns. (Ignores unmonitored Dark Zones).
            </div>
            <div id="predictionsArea">
                <!-- Predictions populate here -->
            </div>
        </div>
    </div>

    <script>
        // The definitive dataset. 'block' ID groups continually monitored sequences. 
        // Gaps between different blocks are "Dark Zones" and will NOT be used for logic.
        let dataset = [
            // SYSTEM A (Blocks 1-7)
            {val: 785.43, tag: 'golden', sys: 'A', block: 1}, {val: 785.53, tag: 'golden', sys: 'A', block: 1}, 
            {val: 787.72, tag: 'mini', sys: 'A', block: 1}, {val: 789.80, tag: 'big', sys: 'A', block: 1}, 
            {val: 790.29, tag: 'parrots', sys: 'A', block: 1}, {val: 790.57, tag: 'golden', sys: 'A', block: 1}, 
            {val: 791.30, tag: 'golden', sys: 'A', block: 1}, {val: 791.39, tag: 'big', sys: 'A', block: 1}, {val: 791.84, tag: 'mini', sys: 'A', block: 1},
            
            {val: 812.95, tag: 'golden', sys: 'A', block: 2}, {val: 813.05, tag: 'parrots', sys: 'A', block: 2}, 
            {val: 813.17, tag: 'parrots', sys: 'A', block: 2}, {val: 813.27, tag: 'golden', sys: 'A', block: 2},
            
            {val: 829.88, tag: 'parrots', sys: 'A', block: 3}, {val: 829.97, tag: 'parrots', sys: 'A', block: 3}, 
            {val: 830.52, tag: 'minor', sys: 'A', block: 3}, {val: 830.66, tag: 'golden', sys: 'A', block: 3}, {val: 830.68, tag: 'golden', sys: 'A', block: 3},
            
            {val: 846.46, tag: 'parrots', sys: 'A', block: 4}, {val: 846.67, tag: 'minor', sys: 'A', block: 4}, {val: 846.70, tag: 'golden', sys: 'A', block: 4}, 
            {val: 847.18, tag: 'big', sys: 'A', block: 4}, {val: 850.25, tag: 'golden', sys: 'A', block: 4}, {val: 850.52, tag: 'golden', sys: 'A', block: 4}, 
            {val: 850.55, tag: 'parrots', sys: 'A', block: 4}, {val: 850.65, tag: 'parrots', sys: 'A', block: 4}, {val: 850.71, tag: 'parrots', sys: 'A', block: 4}, 
            {val: 852.66, tag: 'golden', sys: 'A', block: 4}, {val: 852.70, tag: 'parrots', sys: 'A', block: 4}, {val: 852.70, tag: 'mini', sys: 'A', block: 4}, // Dual Tag
            
            {val: 861.78, tag: 'golden', sys: 'A', block: 5}, {val: 862.23, tag: 'golden', sys: 'A', block: 5},
            
            {val: 873.87, tag: 'golden', sys: 'A', block: 6}, {val: 874.30, tag: 'parrots', sys: 'A', block: 6}, {val: 874.43, tag: 'golden', sys: 'A', block: 6}, 
            {val: 874.70, tag: 'golden', sys: 'A', block: 6}, {val: 875.24, tag: 'golden', sys: 'A', block: 6},
            
            {val: 941.89, tag: 'mini', sys: 'A', block: 7},

            // SYSTEM B (Blocks 8-9)
            {val: 827.34, tag: 'golden', sys: 'B', block: 8}, {val: 827.91, tag: 'golden', sys: 'B', block: 8}, 
            {val: 828.21, tag: 'parrots', sys: 'B', block: 8}, {val: 828.96, tag: 'golden', sys: 'B', block: 8}, 
            {val: 829.35, tag: 'parrots', sys: 'B', block: 8}, {val: 829.54, tag: 'parrots', sys: 'B', block: 8}, 
            {val: 830.08, tag: 'parrots', sys: 'B', block: 8}, {val: 830.30, tag: 'golden', sys: 'B', block: 8},
            {val: 831.02, tag: 'mini', sys: 'B', block: 8}, {val: 831.13, tag: 'golden', sys: 'B', block: 8},
            {val: 832.22, tag: 'parrots', sys: 'B', block: 8}, {val: 832.32, tag: 'golden', sys: 'B', block: 8},
            
            {val: 995.42, tag: 'golden', sys: 'B', block: 9}, {val: 995.45, tag: 'parrots', sys: 'B', block: 9}, {val: 995.50, tag: 'golden', sys: 'B', block: 9}
        ];

        // Terminal Grid Traps mapped from System A & B Convergence
        const terminalSuffixes = [0.23, 0.24, 0.25, 0.30, 0.32, 0.42, 0.43, 0.70, 0.84];

        // Helper to get active block ID (highest block + 1 for new numbers)
        function getLatestBlock() {
            return Math.max(...dataset.map(d => d.block));
        }

        function formatDeltaPrice(targetNum, currentNum) {
            let diff = Math.abs(targetNum - currentNum);
            let ticks = Math.round(diff / 0.01);
            let price = ticks * 2.5;
            let sign = targetNum >= currentNum ? "+$" : "-$";
            return sign + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function buildCard(val, tag, logicText, currentNum, prefix = "+") {
            let priceGap = formatDeltaPrice(val, currentNum);
            let diff = val - currentNum;
            let ticks = Math.round(diff / 0.01);
            return `<div class="pred-card card-${tag}">
                        <div class="pred-card-header">
                            <span class="pred-val">${val.toFixed(2)}</span>
                            <span class="pred-price">[${prefix}${ticks} Ticks | ${priceGap}]</span>
                        </div>
                        <span class="pred-logic">${logicText} (Target: ${tag.toUpperCase()})</span>
                    </div>`;
        }

        function renderData() {
            const counts = { golden: 0, parrots: 0, minor: 0, mini: 0, big: 0 };
            dataset.forEach(item => {
                if (counts[item.tag] !== undefined) counts[item.tag]++;
            });
            
            document.getElementById('count-golden').innerText = counts.golden;
            document.getElementById('count-parrots').innerText = counts.parrots;
            document.getElementById('count-minor').innerText = counts.minor;
            document.getElementById('count-mini').innerText = counts.mini;
            document.getElementById('count-big').innerText = counts.big;

            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            // Group by value to handle dual-tags elegantly
            const grouped = {};
            dataset.forEach(d => {
                if(!grouped[d.val]) grouped[d.val] = { val: d.val, sys: d.sys, tags: [] };
                grouped[d.val].tags.push(d.tag);
            });
            
            const sortedVals = Object.values(grouped).sort((a, b) => a.val - b.val);

            sortedVals.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                
                let tagsHtml = item.tags.map(t => `<span class="tag color-${t}">${t}</span>`).join('');
                
                li.innerHTML = `
                    <div>
                        <span class="sys-tag">Sys ${item.sys || 'Live'}</span>
                        <span>${item.val.toFixed(2)}</span>
                    </div>
                    <div class="tag-group">${tagsHtml}</div>
                `;
                list.appendChild(li);
            });
        }

        function addNumber(tagType) {
            const inputField = document.getElementById('main-input');
            const numInput = inputField.value;
            
            if (!numInput) return;
            const num = parseFloat(numInput);
            
            // Determine block logic: if we are adding a totally new number, assume it's a new isolated block
            // UNLESS it's very close to the last added number (within 2 points)
            let sortedDB = [...dataset].sort((a, b) => b.val - a.val);
            let lastVal = sortedDB.length > 0 ? sortedDB[0].val : num;
            let currentBlock = getLatestBlock();
            
            if(Math.abs(num - lastVal) > 2.00 && !dataset.find(d => d.val === num)) {
                currentBlock++; // Create new Dark Zone boundary
            }

            if (!dataset.find(d => d.val === num && d.tag === tagType)) {
                dataset.push({val: num, tag: tagType, sys: 'Live', block: currentBlock});
                renderData();
            }
            
            generatePredictions(num, tagType);
            
            inputField.value = ''; 
            inputField.blur(); 
        }

        function generatePredictions(currentNum, tagType) {
            const area = document.getElementById('predictionsArea');
            const stateBadge = document.getElementById('stateBadge');
            const modeDesc = document.getElementById('modeDescription');
            const predPanel = document.getElementById('predictionPanel');
            
            area.innerHTML = '';
            let chronoData = [...dataset].sort((a, b) => a.val - b.val);
            let historyIndex = chronoData.findIndex(d => d.val === currentNum);

            // MODE 1: HISTORICAL SEQUENCE MATCH
            if (historyIndex !== -1 && historyIndex < chronoData.length - 1) {
                // Verify the next number is in the SAME contiguous block (no dark zones)
                if (chronoData[historyIndex].block === chronoData[historyIndex+1].block) {
                    stateBadge.className = 'state-badge state-replay';
                    stateBadge.innerText = 'STATE: SEQUENCE MATCH';
                    modeDesc.innerText = `The number ${currentNum.toFixed(2)} is in the database. Projecting the exact monitored sequence that followed it.`;
                    predPanel.style.borderColor = 'var(--state-replay)';

                    let html = `<div class="prediction-category">
                                    <h3 style="color:var(--state-replay);">Exact Block Replay</h3>`;
                    
                    let max = Math.min(historyIndex + 5, chronoData.length);
                    for(let i = historyIndex + 1; i < max; i++) {
                        // Stop if we cross a block boundary (dark zone)
                        if(chronoData[i].block !== chronoData[historyIndex].block) break;
                        
                        let nextTarget = chronoData[i];
                        html += buildCard(nextTarget.val, nextTarget.tag, `Contiguous Monitored Match`, currentNum);
                    }
                    html += `</div>`;
                    area.innerHTML = html;
                    return;
                }
            }

            // MODE 2: LIVE DYNAMIC PATTERN
            let isDormant = (tagType === 'golden' || tagType === 'big');
            
            if (isDormant) {
                stateBadge.className = 'state-badge state-dormant';
                stateBadge.innerText = 'STATE: DORMANT (VOID)';
                modeDesc.innerText = 'System is cooling down. Searching historical database for exact gaps that followed this tag inside contiguous blocks.';
                predPanel.style.borderColor = 'var(--state-dormant)';
            } else {
                stateBadge.className = 'state-badge state-active';
                stateBadge.innerText = 'STATE: ACTIVE (CLUSTER)';
                modeDesc.innerText = 'System is HOT. Prioritizing the 10-Tick Hard-Lock and exact historical cluster gaps.';
                predPanel.style.borderColor = 'var(--state-active)';
            }

            // Database Scan: ONLY look at gaps within the same contiguous block (ignore Dark Zones)
            let historicalNexts = [];
            for(let i = 0; i < chronoData.length - 1; i++) {
                if(chronoData[i].tag === tagType && chronoData[i].block === chronoData[i+1].block) {
                    let gap = Math.round((chronoData[i+1].val - chronoData[i].val) / 0.01);
                    historicalNexts.push({ gap: gap, nextTag: chronoData[i+1].tag });
                }
            }

            let uniqueGaps = [];
            let seenGaps = new Set();
            for(let h of historicalNexts) {
                if(!seenGaps.has(h.gap)) {
                    seenGaps.add(h.gap);
                    uniqueGaps.push(h);
                }
            }
            uniqueGaps.sort((a, b) => a.gap - b.gap);

            let html = ``;

            // If ACTIVE, always inject the Absolute 10-Tick Rule first
            if (!isDormant) {
                html += `<div class="prediction-category">
                            <h3 style="color:var(--state-active);">Primary Active Traps</h3>
                            ${buildCard(currentNum + 0.10, 'golden', `Absolute 10-Tick Hard-Lock`, currentNum)}
                         </div>`;
            }

            html += `<div class="prediction-category">
                        <h3>Projected Historical Block Gaps</h3>`;
            
            if(uniqueGaps.length === 0) {
                 html += `<p style="font-size:0.85rem; color:#8892a0;">No contiguous historical data available for this tag.</p>`;
            } else {
                 uniqueGaps.slice(0, 5).forEach(u => {
                     // Don't duplicate the 10-tick if it's already shown above
                     if (!isDormant && u.gap === 10) return; 
                     let projectedVal = currentNum + (u.gap * 0.01);
                     html += buildCard(projectedVal, u.nextTag, `Verified Historical Drop Gap`, currentNum);
                 });
            }
            
            html += `</div>`;
            area.innerHTML = html;
        }

        renderData();
    </script>
</body>
</html>
